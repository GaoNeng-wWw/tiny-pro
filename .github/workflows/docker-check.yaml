name: Docker Check

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

jobs:
  docker-check:
    name: Docker Check
    if: ${{github.event.issue.pull_request}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build docker image
        working-directory: ./template/nestJs
        run: docker-compose docker-compose.yaml build
      - name: Run docker compose
        working-directory: ./template/nestJs
        run: docker-compose up -d
      - name: Wait Service
        run: timeout 60 bash -c 'until docker-compose ps | grep healthy; do sleep 2; done' || true
      - name: Send HealthCheck Request
        run: curl -k http://localhost:3000/healthCheck
      - name: Check service logs
        if: failure()
        run: |
          docker-compose logs back
      - name: Shutdown Service
        run: docker-compose down
